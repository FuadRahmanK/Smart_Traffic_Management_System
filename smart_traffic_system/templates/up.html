<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Traffic System</title>
<link rel="stylesheet" href="/static/theme.css">
<style>

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(160deg, #0c1525 0%, #0f1d2e 60%, #111e30 100%);
  font-family: "Space Grotesk", sans-serif;
  color: #e8f0fa;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 54px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(8,15,26,0.7);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-indicator {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #3b9eff;
  box-shadow: 0 0 8px rgba(59,158,255,0.7);
}

.topbar-title {
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: #b8d0ea;
}

.topbar-right {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(180,205,235,0.3);
}

/* PAGE */
.page {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 20px;
}

.page-header {
  width: min(520px, 100%);
  margin-bottom: 24px;
}

.page-header h1 {
  margin: 0 0 5px;
  font-size: 1.6rem;
  font-weight: 700;
  color: #f0f7ff;
  letter-spacing: -0.2px;
}

.page-header p {
  margin: 0;
  font-size: 0.86rem;
  color: rgba(180,205,235,0.45);
}

/* CARD */
.card {
  width: min(520px, 100%);
  background: rgba(14,24,40,0.9);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  overflow: hidden;
}

/* FORM */
form {
  padding: 22px 22px 0;
  display: grid;
  gap: 9px;
}

.lane-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 9px;
  background: rgba(255,255,255,0.025);
  transition: border-color 180ms, background 180ms;
}

.lane-row:hover,
.lane-row:focus-within {
  border-color: rgba(59,158,255,0.28);
  background: rgba(59,158,255,0.04);
}

.lane-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: #a8c4df;
  letter-spacing: 0.2px;
}

.input-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

input[type="file"] {
  width: 100%;
  font-family: inherit;
  font-size: 0.82rem;
  color: rgba(180,210,240,0.65);
}

input[type="file"]::file-selector-button {
  border: 1px solid rgba(59,158,255,0.28);
  border-radius: 6px;
  padding: 5px 11px;
  margin-right: 10px;
  background: rgba(59,158,255,0.07);
  color: #6db8f5;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms, border-color 150ms;
}

input[type="file"]::file-selector-button:hover {
  background: rgba(59,158,255,0.15);
  border-color: rgba(59,158,255,0.5);
}

.file-name {
  font-size: 0.76rem;
  color: rgba(160,190,220,0.35);
}

.file-name.selected {
  color: #48a87a;
  font-weight: 500;
}

/* SUBMIT */
.card-footer {
  padding: 18px 22px 22px;
}

button[type="submit"] {
  width: 100%;
  border: none;
  border-radius: 9px;
  padding: 13px;
  background: #1a6fc4;
  color: #fff;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition: background 160ms, box-shadow 160ms, transform 120ms;
}

button[type="submit"]:hover {
  background: #1c7cd8;
  box-shadow: 0 5px 18px rgba(26,111,196,0.45);
  transform: translateY(-1px);
}

button[type="submit"]:active {
  transform: translateY(0);
}

/* FOOTER */
.site-footer {
  padding: 18px;
  text-align: center;
  font-size: 0.72rem;
  color: rgba(160,190,220,0.2);
  flex-shrink: 0;
}

</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="topbar-indicator"></div>
    <span class="topbar-title">Smart Traffic System</span>
  </div>
  <span class="topbar-right">Setup</span>
</header>

<div class="page">

  <div class="page-header">
    <h1>Load Lane Videos</h1>
    <p>Select one video file per intersection lane to begin.</p>
  </div>

  <div class="card">
    <form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">
      <div class="lane-row">
        <label class="lane-label" for="lane1">Lane 1</label>
        <div class="input-wrap">
          <input id="lane1" type="file" name="lane1" accept="video/*" required>
          <span class="file-name" data-file-name="lane1">No file selected</span>
        </div>
      </div>

      <div class="lane-row">
        <label class="lane-label" for="lane2">Lane 2</label>
        <div class="input-wrap">
          <input id="lane2" type="file" name="lane2" accept="video/*" required>
          <span class="file-name" data-file-name="lane2">No file selected</span>
        </div>
      </div>

      <div class="lane-row">
        <label class="lane-label" for="lane3">Lane 3</label>
        <div class="input-wrap">
          <input id="lane3" type="file" name="lane3" accept="video/*" required>
          <span class="file-name" data-file-name="lane3">No file selected</span>
        </div>
      </div>

      <div class="lane-row">
        <label class="lane-label" for="lane4">Lane 4</label>
        <div class="input-wrap">
          <input id="lane4" type="file" name="lane4" accept="video/*" required>
          <span class="file-name" data-file-name="lane4">No file selected</span>
        </div>
      </div>
    </form>

    <div class="card-footer">
      <button type="submit" form="uploadForm">Initialise System</button>
    </div>
  </div>

</div>

<footer class="site-footer">Smart Traffic System &nbsp;·&nbsp; Adaptive Signal Control</footer>

<script>
const inputs = document.querySelectorAll('input[type="file"]');
inputs.forEach((input) => {
  const output = document.querySelector(`[data-file-name="${input.id}"]`);
  input.addEventListener("change", () => {
    const selectedFile = input.files && input.files.length ? input.files[0].name : "No file selected";
    output.textContent = selectedFile;
    output.classList.toggle("selected", selectedFile !== "No file selected");
  });
});
</script>
</body>
</html>
